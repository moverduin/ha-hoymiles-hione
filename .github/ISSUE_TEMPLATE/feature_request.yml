name: Feature request
description: Suggest a new sensor, control or improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: Describe the feature and the problem it solves.
    validations:
      required: true
  - type: textarea
    id: registers
    attributes:
      label: Registers involved (if known)
      description: Addresses from the [register map](https://github.com/moverduin/ha-hoymiles-hione/blob/main/docs/registers.md).
  - type: checkboxes
    id: write
    attributes:
      label: Write access
      options:
        - label: This feature needs to write to the device.
