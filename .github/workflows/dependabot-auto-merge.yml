name: Dependabot auto-merge

# Patch and minor dependency updates (and hassfest commit bumps) are merged
# automatically once the required checks (Ruff, Pytest, Hassfest, HACS) pass.
# Major updates wait for a maintainer.

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Auto-merge
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'moverduin/ha-hoymiles-hione'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # hassfest is pinned to a commit on Home Assistant's master branch. Dependabot
      # cannot derive a semver change from commit hashes and reports such bumps as
      # major, so they are treated as routine updates.
      - name: Decide
        id: decide
        env:
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          DEPENDENCIES: ${{ steps.metadata.outputs.dependency-names }}
        run: |
          if [ "$UPDATE_TYPE" != "version-update:semver-major" ] \
             || [ "$DEPENDENCIES" = "home-assistant/actions/hassfest" ]; then
            echo "auto=true" >> "$GITHUB_OUTPUT"
          else
            echo "auto=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Enable auto-merge for routine updates
        if: steps.decide.outputs.auto == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"

      - name: Ask for review of major updates
        if: steps.decide.outputs.auto != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr comment "$PR_URL" --body "This is a **major** version update, so it is not merged automatically. Check the release notes, then merge it manually when the checks are green."
