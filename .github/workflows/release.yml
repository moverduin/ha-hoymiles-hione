name: Release

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  release:
    name: Attach integration zip
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check that the tag matches manifest.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(jq -r .version custom_components/hoymiles_hione/manifest.json)
          if [ "v${version}" != "${TAG}" ] && [ "${version}" != "${TAG}" ]; then
            echo "::error::Tag ${TAG} does not match manifest version ${version}"
            exit 1
          fi

      - name: Build zip
        run: |
          cd custom_components/hoymiles_hione
          zip -r "${GITHUB_WORKSPACE}/hoymiles_hione.zip" . -x '__pycache__/*'

      - name: Upload zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "${TAG}" hoymiles_hione.zip --clobber --repo "${GITHUB_REPOSITORY}"
