# Based on https://github.com/home-assistant/core/blob/dev/pyproject.toml

target-version = "py313"

[lint]
select = ["ALL"]

ignore = [
    "ANN401", # Dynamically typed expressions (typing.Any) are disallowed
    "D203",   # no-blank-line-before-class (incompatible with formatter)
    "D212",   # multi-line-summary-first-line (incompatible with formatter)
    "COM812", # incompatible with formatter
    "ISC001", # incompatible with formatter
    "TRY003", # long exception messages are useful for Modbus errors
    "EM101",  # string literals in exceptions
    "CPY001", # no per-file copyright headers; see LICENSE
]

[lint.per-file-ignores]
"tests/**" = [
    "S101",    # assert is how pytest works
    "PLR2004", # magic values in tests are fine
    "SLF001",  # tests may touch private members
    "ANN001",  # fixtures and parametrised args need no annotations
    "ANN002",
    "ANN003",
    "ARG001",  # fixtures requested only for their side effect
    "TC002",
    "TC003",
    "D103",
]

[lint.flake8-pytest-style]
fixture-parentheses = false

[lint.pyupgrade]
keep-runtime-typing = true

[lint.mccabe]
max-complexity = 25
